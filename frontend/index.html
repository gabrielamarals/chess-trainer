<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Trainer</title>
    <link rel="stylesheet" href="/style.css?v=3" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">CHESS TRAINER</p>
        <h1>Aprenda jogando</h1>
        <p class="subtitle">O backend valida as regras. Este tabuleiro apenas apresenta a posição e envia seus movimentos.</p>
      </header>

      <section class="game-layout" aria-label="Partida de xadrez">
        <div class="board-wrapper">
          <div id="board" class="board" aria-label="Tabuleiro de xadrez"></div>
        </div>

        <aside class="panel">
          <div class="mode-tabs" role="tablist" aria-label="Modo de jogo">
            <button id="mode-engine" type="button" role="tab">Contra Stockfish</button>
            <button id="mode-local" type="button" role="tab">2 jogadores</button>
          </div>

          <p id="turn" class="turn">Carregando...</p>
          <p id="message" class="message" role="status"></p>
          <div id="engine-settings">
            <label for="player-color">Você joga com</label>
            <select id="player-color">
              <option value="white">Brancas</option>
              <option value="black">Pretas</option>
            </select>

            <label for="opponent-rating">Rating do adversário</label>
            <select id="opponent-rating">
              <option value="500">500 — Iniciante</option>
              <option value="1000">1000 — Casual</option>
              <option value="1500" selected>1500 — Intermediário</option>
              <option value="2000">2000 — Avançado</option>
              <option value="2500">2500 — Mestre</option>
              <option value="3000">3000 — Elite</option>
            </select>
          </div>

          <button id="new-game-button" type="button">Nova partida</button>

          <div class="review-controls" aria-label="Navegação pelo histórico">
            <button id="history-back" type="button">← Voltar</button>
            <button id="history-forward" type="button">Avançar →</button>
          </div>
          <button id="history-current" class="history-current" type="button" hidden>
            Voltar à posição atual
          </button>
          <p id="review-status" class="review-status" hidden></p>

          <section class="analysis-card" aria-labelledby="analysis-title">
            <div class="analysis-heading">
              <h2 id="analysis-title">Análise da sua jogada</h2>
              <span id="analysis-classification" class="analysis-badge" hidden></span>
            </div>
            <p id="analysis-summary" class="analysis-empty">
              Faça um movimento para receber a avaliação do Stockfish.
            </p>
            <dl id="analysis-details" class="analysis-details" hidden>
              <div>
                <dt>Seu lance</dt>
                <dd id="analysis-move">—</dd>
              </div>
              <div>
                <dt>Melhor lance</dt>
                <dd id="analysis-best-move">—</dd>
              </div>
              <div>
                <dt>Avaliação</dt>
                <dd id="analysis-evaluation">—</dd>
              </div>
              <div>
                <dt>Perda</dt>
                <dd id="analysis-loss">—</dd>
              </div>
            </dl>
            <p id="analysis-line" class="analysis-line" hidden></p>
          </section>

          <h2>Movimentos</h2>
          <div id="history" class="history" role="list"></div>
        </aside>
      </section>
    </main>

    <script src="/app.js?v=3"></script>
  </body>
</html>
